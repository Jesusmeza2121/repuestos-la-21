spring.application.name=Inventario Electrodomesticos
server.port=${SERVER_PORT:8091}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventario_electrodomesticos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.mvc.locale=es_CO
spring.jackson.time-zone=America/Bogota

