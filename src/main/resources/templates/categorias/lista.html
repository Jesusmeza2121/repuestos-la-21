<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Categorías</h1><a class="btn btn-danger" th:href="@{/categorias/nueva}"><i class="bi bi-plus-lg"></i> Nueva categoría</a></div><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form class="toolbar mb-3"><input class="form-control" name="buscar" th:value="${buscar}" placeholder="Buscar categoría"><button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button></form><div class="table-panel table-responsive"><table class="table table-hover"><thead><tr><th>Nombre</th><th>Descripción</th><th>Productos</th><th>Acciones</th></tr></thead><tbody><tr th:each="c:${categorias}"><td th:text="${c.nombre}"></td><td th:text="${c.descripcion}"></td><td th:text="${c.cantidadProductos}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{/categorias/{id}/editar(id=${c.id})}"><i class="bi bi-pencil"></i></a><form class="d-inline" th:action="@{/categorias/{id}/eliminar(id=${c.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger" data-confirm="¿Eliminar esta categoría?"><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(categorias)}"><td colspan="4" class="text-center py-4 text-secondary">No hay categorías registradas.</td></tr></tbody></table></div></section></body></html>
