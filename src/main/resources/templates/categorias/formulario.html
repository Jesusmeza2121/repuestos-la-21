<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Categoría</h1><a class="btn btn-outline-secondary" th:href="@{/categorias}">Volver</a></div><div class="form-panel"><form th:action="@{/categorias}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="id" th:value="${categoria.id}"><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" name="nombre" th:value="${categoria.nombre}" required></div><div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" th:text="${categoria.descripcion}"></textarea></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="activo" value="true" th:checked="${categoria.activo}"><label class="form-check-label">Activa</label></div><button class="btn btn-danger">Guardar</button></form></div></section></body></html>
