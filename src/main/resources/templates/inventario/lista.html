<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Inventario</h1></div><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="row g-3"><div class="col-lg-7"><div class="table-panel table-responsive"><table class="table table-hover"><thead><tr><th>Código</th><th>Producto</th><th>Stock</th><th>Mínimo</th><th>Estado</th></tr></thead><tbody><tr th:each="p:${productos}"><td th:text="${p.codigo}"></td><td th:text="${p.nombre}"></td><td th:text="${p.stock}"></td><td th:text="${p.stockMinimo}"></td><td><span th:class="${p.stock==0?'badge text-bg-danger':(p.stock<=p.stockMinimo?'badge text-bg-warning':'badge text-bg-success')}" th:text="${p.stock==0?'Agotado':(p.stock<=p.stockMinimo?'Stock bajo':'Normal')}"></span></td></tr></tbody></table></div></div><div class="col-lg-5"><div class="form-panel"><h2 class="h5 mb-3">Registrar movimiento</h2><form th:action="@{/inventario/ajuste}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-3"><label class="form-label">Producto</label><select class="form-select" name="productoId"><option th:each="p:${productos}" th:value="${p.id}" th:text="${p.nombre}"></option></select></div><div class="row g-2"><div class="col-6"><label class="form-label">Tipo</label><select class="form-select" name="tipo"><option>Entrada</option><option>Salida</option><option>Ajuste</option></select></div><div class="col-6"><label class="form-label">Cantidad / Stock final</label><input class="form-control" type="number" min="1" name="cantidad" required></div></div><div class="mb-3 mt-3"><label class="form-label">Motivo</label><textarea class="form-control" name="motivo" required></textarea></div><button class="btn btn-danger">Registrar</button></form></div></div></div><div class="table-panel table-responsive mt-4"><div class="p-3 border-bottom"><strong>Historial de movimientos</strong></div><table class="table"><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Anterior</th><th>Nuevo</th><th>Referencia</th></tr></thead><tbody><tr th:each="m:${movimientos}"><td th:text="${#temporals.format(m.fecha,'dd/MM/yyyy HH:mm')}"></td><td th:text="${m.productoNombre}"></td><td th:text="${m.tipoMovimiento}"></td><td th:text="${m.cantidad}"></td><td th:text="${m.stockAnterior}"></td><td th:text="${m.stockNuevo}"></td><td th:text="${m.referencia}"></td></tr></tbody></table></div></section></body></html>
