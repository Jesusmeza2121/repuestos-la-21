<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar sesión | Repuestos LA 21</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="login-page">
  <section class="login-card">
    <div class="login-brand">
      <img th:src="@{/img/Logo-New.jpeg}" alt="Repuestos LA 21">
    </div>
    <h1 class="h4 text-center mb-1">Repuestos LA 21</h1>
    <p class="text-secondary text-center mb-4">Acceso administrativo</p>
    <div th:if="${param.error}" class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
    <div th:if="${param.logout}" class="alert alert-success py-2">Sesión cerrada correctamente.</div>
    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="mb-3">
        <label class="form-label">Nombre de usuario</label>
        <input class="form-control" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <input class="form-control" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-danger w-100" type="submit">Ingresar</button>
    </form>
  </section>
</main>
</body>
</html>
