<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Dashboard</h1></div><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div class="row g-3 mb-4"><div class="col-sm-6 col-xl-3"><div class="card-stat"><i class="bi bi-box"></i><div class="value" th:text="${totalProductos}">0</div><div class="label">Productos</div></div></div><div class="col-sm-6 col-xl-3"><div class="card-stat"><i class="bi bi-tags"></i><div class="value" th:text="${totalCategorias}">0</div><div class="label">Categorías</div></div></div><div class="col-sm-6 col-xl-3"><div class="card-stat"><i class="bi bi-truck"></i><div class="value" th:text="${totalProveedores}">0</div><div class="label">Proveedores</div></div></div><div class="col-sm-6 col-xl-3"><div class="card-stat"><i class="bi bi-exclamation-triangle"></i><div class="value" th:text="${stockBajo}">0</div><div class="label">Stock bajo</div></div></div><div class="col-sm-6 col-xl-3"><div class="card-stat"><i class="bi bi-x-circle"></i><div class="value" th:text="${sinExistencias}">0</div><div class="label">Sin existencias</div></div></div><div class="col-sm-6 col-xl-3"><div class="card-stat"><i class="bi bi-cart-plus"></i><div class="value" th:text="'$ ' + ${#numbers.formatDecimal(totalCompras * 1000,1,'POINT',0,'COMMA')}">$0</div><div class="label">Compras</div></div></div><div class="col-sm-6 col-xl-3"><div class="card-stat"><i class="bi bi-cash-coin"></i><div class="value" th:text="'$ ' + ${#numbers.formatDecimal(totalVentas * 1000,1,'POINT',0,'COMMA')}">$0</div><div class="label">Ventas</div></div></div></div><div class="table-panel"><div class="p-3 border-bottom"><strong>Movimientos recientes</strong></div><div class="table-responsive"><table class="table"><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Stock nuevo</th></tr></thead><tbody><tr th:each="m:${movimientos}"><td th:text="${#temporals.format(m.fecha,'dd/MM/yyyy HH:mm')}"></td><td th:text="${m.productoNombre}"></td><td th:text="${m.tipoMovimiento}"></td><td th:text="${m.cantidad}"></td><td th:text="${m.stockNuevo}"></td></tr><tr th:if="${#lists.isEmpty(movimientos)}"><td colspan="5" class="text-center py-4 text-secondary">No hay movimientos registrados.</td></tr></tbody></table></div></div></section></body></html>
