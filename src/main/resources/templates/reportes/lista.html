<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Reportes</h1><a class="btn btn-outline-secondary" th:href="@{/reportes/csv(tipo=${tipo})}"><i class="bi bi-download"></i> Exportar CSV</a></div><div class="toolbar mb-3"><a class="btn" th:classappend="${tipo=='inventario'}?'btn-danger':'btn-outline-secondary'" th:href="@{/reportes(tipo='inventario')}">Inventario</a><a class="btn" th:classappend="${tipo=='movimientos'}?'btn-danger':'btn-outline-secondary'" th:href="@{/reportes(tipo='movimientos')}">Movimientos</a></div><div class="table-panel table-responsive"><table th:if="${tipo=='inventario'}" class="table table-hover"><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Stock</th><th>Mínimo</th><th>Precio venta</th></tr></thead><tbody><tr th:each="r:${inventario}"><td th:text="${r.codigo}"></td><td th:text="${r.nombre}"></td><td th:text="${r.categoria}"></td><td th:text="${r.stock}"></td><td th:text="${r.stock_minimo}"></td><td th:text="'$ ' + ${#numbers.formatDecimal(r.precio_venta * 1000,1,'POINT',0,'COMMA')}"></td></tr></tbody></table><table th:if="${tipo=='movimientos'}" class="table table-hover"><thead><tr><th>Fecha</th><th>Código</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Anterior</th><th>Nuevo</th></tr></thead><tbody><tr th:each="r:${movimientos}"><td th:text="${r.fecha}"></td><td th:text="${r.codigo}"></td><td th:text="${r.nombre}"></td><td th:text="${r.tipo_movimiento}"></td><td th:text="${r.cantidad}"></td><td th:text="${r.stock_anterior}"></td><td th:text="${r.stock_nuevo}"></td></tr></tbody></table></div></section></body></html>
