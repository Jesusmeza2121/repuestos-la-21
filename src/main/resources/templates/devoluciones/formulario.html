<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Nueva devolución</h1><a class="btn btn-outline-secondary" th:href="@{/devoluciones}">Volver</a></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="form-panel"><form th:action="@{/devoluciones}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Venta</label><select class="form-select" name="ventaId" id="ventaId" required><option value="">Seleccione una venta</option><option th:each="v:${ventas}" th:value="${v.id}" th:text="${'Venta #' + v.id + ' - ' + v.metodoPago}"></option></select></div><div class="col-md-6"><label class="form-label">Producto vendido</label><select class="form-select" name="productoId" id="productoId" required><option value="">Seleccione la venta primero</option></select></div><div class="col-md-3"><label class="form-label">Cantidad</label><input class="form-control" type="number" min="1" name="cantidad" required></div><div class="col-md-9"><label class="form-label">Motivo</label><textarea class="form-control" name="motivo" required></textarea></div></div><button class="btn btn-danger mt-4">Registrar devolución</button></form></div></section></body></html>
