<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Devoluciones</h1><a class="btn btn-danger" th:href="@{/devoluciones/nueva}"><i class="bi bi-plus-lg"></i> Nueva devolución</a></div><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="table-panel table-responsive"><table class="table table-hover"><thead><tr><th>Fecha</th><th>Venta</th><th>Producto</th><th>Cantidad</th><th>Estado</th><th>Motivo</th></tr></thead><tbody><tr th:each="d:${devoluciones}"><td th:text="${#temporals.format(d.fecha,'dd/MM/yyyy HH:mm')}"></td><td th:text="${d.ventaId}"></td><td th:text="${d.productoNombre}"></td><td th:text="${d.cantidad}"></td><td><span class="badge text-bg-success" th:text="${d.estado}"></span></td><td th:text="${d.motivo}"></td></tr><tr th:if="${#lists.isEmpty(devoluciones)}"><td colspan="6" class="text-center py-4 text-secondary">No hay devoluciones registradas.</td></tr></tbody></table></div></section></body></html>
