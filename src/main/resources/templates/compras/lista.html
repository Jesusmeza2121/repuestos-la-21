<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Compras</h1><a class="btn btn-danger" th:href="@{/compras/nueva}"><i class="bi bi-plus-lg"></i> Registrar compra</a></div><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="table-panel table-responsive"><table class="table table-hover"><thead><tr><th>Fecha</th><th>Proveedor</th><th>Factura</th><th>Total</th><th></th></tr></thead><tbody><tr th:each="c:${compras}"><td th:text="${#temporals.format(c.fecha,'dd/MM/yyyy HH:mm')}"></td><td th:text="${c.proveedorNombre}"></td><td th:text="${c.numeroFactura}"></td><td th:text="'$ ' + ${#numbers.formatDecimal(c.total * 1000,1,'POINT',0,'COMMA')}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{/compras/{id}(id=${c.id})}"><i class="bi bi-eye"></i></a></td></tr><tr th:if="${#lists.isEmpty(compras)}"><td colspan="5" class="text-center py-4 text-secondary">No hay compras registradas.</td></tr></tbody></table></div></section></body></html>
