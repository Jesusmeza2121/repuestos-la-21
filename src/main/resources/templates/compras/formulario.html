<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Nueva compra</h1><a class="btn btn-outline-secondary" th:href="@{/compras}">Volver</a></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="form-panel"><form th:action="@{/compras}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3 mb-4"><div class="col-md-8"><label class="form-label">Proveedor</label><select class="form-select" name="proveedorId" required><option th:each="p:${proveedores}" th:value="${p.id}" th:text="${p.nombre}"></option></select></div><div class="col-md-4"><label class="form-label">Número de factura</label><input class="form-control" name="factura"></div><div class="col-12"><label class="form-label">Observaciones</label><textarea class="form-control" name="observaciones"></textarea></div></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio compra</th><th class="text-center">Acción</th></tr></thead><tbody id="items"><tr class="item-row"><td><select class="form-select" name="productoId" required><option th:each="p:${productos}" th:value="${p.id}" th:text="${p.nombre}"></option></select></td><td><input class="form-control" type="number" min="1" name="cantidad" value="1" required></td><td><input class="form-control" type="number" min="0" step="0.01" name="precio" required></td><td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger" data-remove-row title="Quitar producto"><i class="bi bi-trash"></i></button></td></tr></tbody></table></div><button type="button" class="btn btn-outline-secondary mb-3" data-clone-row="items"><i class="bi bi-plus-lg"></i> Agregar producto</button><div><button class="btn btn-danger">Guardar compra</button></div></form></div></section></body></html>
