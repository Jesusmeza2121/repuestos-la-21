<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Detalle de compra</h1><a class="btn btn-outline-secondary" th:href="@{/compras}">Volver</a></div><div class="form-panel mb-3"><strong th:text="${compra.proveedorNombre}"></strong><span class="ms-3 text-secondary" th:text="${#temporals.format(compra.fecha,'dd/MM/yyyy HH:mm')}"></span><div class="mt-2" th:text="'Total: $ ' + ${#numbers.formatDecimal(compra.total * 1000,1,'POINT',0,'COMMA')}"></div></div><div class="table-panel table-responsive"><table class="table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody><tr th:each="d:${detalles}"><td th:text="${d.productoNombre}"></td><td th:text="${d.cantidad}"></td><td th:text="'$ ' + ${#numbers.formatDecimal(d.precioCompra * 1000,1,'POINT',0,'COMMA')}"></td><td th:text="'$ ' + ${#numbers.formatDecimal(d.subtotal * 1000,1,'POINT',0,'COMMA')}"></td></tr></tbody></table></div></section></body></html>
