<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Nuevo usuario</h1><a class="btn btn-outline-secondary" th:href="@{/usuarios}">Volver</a></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="form-panel"><form th:action="@{/usuarios}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre de usuario</label><input class="form-control" name="nombreUsuario" required></div><div class="col-md-6"><label class="form-label">Nombre completo</label><input class="form-control" name="nombreCompleto" required></div><div class="col-md-6"><label class="form-label">Contraseña temporal</label><input class="form-control" type="password" name="password" minlength="8" required></div><div class="col-md-6"><label class="form-label">Rol</label><select class="form-select" name="rol"><option>EMPLEADO</option><option>ADMIN</option></select></div></div><button class="btn btn-danger mt-4">Crear usuario</button></form></div></section></body></html>
