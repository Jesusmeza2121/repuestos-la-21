<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Usuarios</h1><a class="btn btn-danger" th:href="@{/usuarios/nuevo}"><i class="bi bi-plus-lg"></i> Nuevo usuario</a></div><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="table-panel table-responsive"><table class="table table-hover"><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="u:${usuarios}"><td th:text="${u.nombreUsuario}"></td><td th:text="${u.nombreCompleto}"></td><td th:text="${u.rol}"></td><td><span th:class="${u.activo?'badge text-bg-success':'badge text-bg-secondary'}" th:text="${u.activo?'Activo':'Inactivo'}"></span></td><td><form th:action="@{/usuarios/{id}/estado(id=${u.id})}" method="post" class="d-flex gap-1"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="nombreCompleto" th:value="${u.nombreCompleto}"><select class="form-select form-select-sm" name="rol"><option th:selected="${u.rol=='ADMIN'}">ADMIN</option><option th:selected="${u.rol=='EMPLEADO'}">EMPLEADO</option></select><div class="form-check mt-2"><input class="form-check-input" type="checkbox" name="activo" value="true" th:checked="${u.activo}"></div><button class="btn btn-sm btn-outline-secondary">Guardar</button></form></td></tr></tbody></table></div></section></body></html>
