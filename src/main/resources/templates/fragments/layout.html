<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(content)">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repuestos LA 21</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" th:href="@{/dashboard}" aria-label="Repuestos LA 21 - Inicio">
      <img class="brand-logo" th:src="@{/img/Logo-New.jpeg}" alt="Repuestos LA 21">
    </a>
    <nav class="nav flex-column">
      <a th:href="@{/dashboard}"><i class="bi bi-grid"></i><span>Dashboard</span></a>
      <a th:href="@{/productos}"><i class="bi bi-box"></i><span>Productos</span></a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/categorias}"><i class="bi bi-tags"></i><span>Categorías</span></a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/proveedores}"><i class="bi bi-truck"></i><span>Proveedores</span></a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/compras}"><i class="bi bi-cart-plus"></i><span>Compras</span></a>
      <a th:href="@{/ventas}"><i class="bi bi-cash-coin"></i><span>Ventas</span></a>
      <a th:href="@{/devoluciones}"><i class="bi bi-arrow-counterclockwise"></i><span>Devoluciones</span></a>
      <a th:href="@{/inventario}"><i class="bi bi-clipboard-data"></i><span>Inventario</span></a>
      <a th:href="@{/reportes}"><i class="bi bi-file-earmark-bar-graph"></i><span>Reportes</span></a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}"><i class="bi bi-people"></i><span>Usuarios</span></a>
    </nav>
  </aside>
  <main class="main-area">
    <header class="topbar"><div><strong th:text="${#authentication.name}">Usuario</strong><small sec:authorize="hasRole('ADMIN')">Administrador</small><small sec:authorize="hasRole('EMPLEADO')">Empleado</small></div><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button></form></header>
    <section class="page-content" th:insert="${content}"></section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
