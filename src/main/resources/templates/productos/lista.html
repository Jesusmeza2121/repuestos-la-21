<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Productos</h1><a class="btn btn-danger" th:href="@{/productos/nuevo}"><i class="bi bi-plus-lg"></i> Nuevo producto</a></div><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form class="toolbar mb-3" th:action="@{/productos}"><input class="form-control" name="buscar" th:value="${buscar}" placeholder="Código o nombre"><button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button></form><div class="table-panel"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Stock</th><th>Precio venta</th><th>Acciones</th></tr></thead><tbody><tr th:each="p:${productos}"><td th:text="${p.codigo}"></td><td th:text="${p.nombre}"></td><td th:text="${p.categoriaNombre}"></td><td><span th:class="${p.stock<=p.stockMinimo?'badge text-bg-danger':'badge text-bg-success'}" th:text="${p.stock}"></span></td><td th:text="' $ ' + ${#numbers.formatDecimal(p.precioVenta * 1000,1,'POINT',0,'COMMA')}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{/productos/{id}/editar(id=${p.id})}"><i class="bi bi-pencil"></i></a><form class="d-inline" th:action="@{/productos/{id}/eliminar(id=${p.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger" data-confirm="¿Eliminar este producto?"><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(productos)}"><td colspan="6" class="text-center py-4 text-secondary">No hay productos registrados.</td></tr></tbody></table></div></div></section></body></html>
