<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1 th:text="${producto.id==null?'Nuevo producto':'Editar producto'}"></h1><a class="btn btn-outline-secondary" th:href="@{/productos}">Volver</a></div><div class="form-panel"><form th:action="@{/productos}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="id" th:value="${producto.id}"><div class="row g-3"><div class="col-md-3"><label class="form-label">Código</label><input class="form-control" name="codigo" th:value="${producto.codigo}" required></div><div class="col-md-5"><label class="form-label">Nombre</label><input class="form-control" name="nombre" th:value="${producto.nombre}" required></div><div class="col-md-4"><label class="form-label">Unidad</label><select class="form-select" name="unidad" required><option th:selected="${producto.unidad=='Unidad'}">Unidad</option><option th:selected="${producto.unidad=='Pieza'}">Pieza</option><option th:selected="${producto.unidad=='Juego'}">Juego</option><option th:selected="${producto.unidad=='Metro'}">Metro</option><option th:selected="${producto.unidad=='Kit'}">Kit</option><option th:selected="${producto.unidad=='Par'}">Par</option><option th:selected="${producto.unidad=='Caja'}">Caja</option></select></div><div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" th:text="${producto.descripcion}"></textarea></div><div class="col-md-6"><label class="form-label">Categoría</label><select class="form-select" name="categoriaId"><option th:each="c:${categorias}" th:value="${c.id}" th:text="${c.nombre}" th:selected="${producto.categoriaId==c.id}"></option></select></div><div class="col-md-6"><label class="form-label">Proveedor</label><div class="input-group"><select class="form-select" name="proveedorId"><option th:each="p:${proveedores}" th:value="${p.id}" th:text="${p.nombre}" th:selected="${producto.proveedorId==p.id}"></option></select><a class="btn btn-outline-secondary" th:href="@{/proveedores/nuevo}" title="Agregar proveedor"><i class="bi bi-plus-lg"></i></a></div></div><div class="col-md-3"><label class="form-label">Precio compra</label><input class="form-control" type="number" min="0" step="0.01" name="precioCompra" th:value="${producto.precioCompra}" required></div><div class="col-md-3"><label class="form-label">Precio venta</label><input class="form-control" type="number" min="0" step="0.01" name="precioVenta" th:value="${producto.precioVenta}" required></div><div class="col-md-3"><label class="form-label">Stock</label><input class="form-control" type="number" min="0" name="stock" th:value="${producto.stock}" required></div><div class="col-md-3"><label class="form-label">Stock mínimo</label><input class="form-control" type="number" min="0" name="stockMinimo" th:value="${producto.stockMinimo}" required></div><div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="activo" value="true" th:checked="${producto.activo}"><label class="form-check-label">Activo</label></div></div></div><div class="mt-4"><button class="btn btn-danger" type="submit">Guardar</button></div></form></div></section></body></html>
