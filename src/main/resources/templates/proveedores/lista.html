<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Proveedores</h1><a class="btn btn-danger" th:href="@{/proveedores/nuevo}"><i class="bi bi-plus-lg"></i> Nuevo proveedor</a></div><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form class="toolbar mb-3"><input class="form-control" name="buscar" th:value="${buscar}" placeholder="Nombre o documento"><button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button></form><div class="table-panel table-responsive"><table class="table table-hover"><thead><tr><th>Nombre</th><th>Documento</th><th>Teléfono</th><th>Correo</th><th>Acciones</th></tr></thead><tbody><tr th:each="p:${proveedores}"><td th:text="${p.nombre}"></td><td th:text="${p.documento}"></td><td th:text="${p.telefono}"></td><td th:text="${p.correo}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{/proveedores/{id}/editar(id=${p.id})}"><i class="bi bi-pencil"></i></a><form class="d-inline" th:action="@{/proveedores/{id}/eliminar(id=${p.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger" data-confirm="¿Eliminar este proveedor?"><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(proveedores)}"><td colspan="5" class="text-center py-4 text-secondary">No hay proveedores registrados.</td></tr></tbody></table></div></section></body></html>
