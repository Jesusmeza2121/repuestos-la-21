<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Proveedor</h1><a class="btn btn-outline-secondary" th:href="@{/proveedores}">Volver</a></div><div class="form-panel"><form th:action="@{/proveedores}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="id" th:value="${proveedor.id}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="nombre" th:value="${proveedor.nombre}" required></div><div class="col-md-6"><label class="form-label">Documento</label><input class="form-control" name="documento" th:value="${proveedor.documento}"></div><div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" name="telefono" th:value="${proveedor.telefono}"></div><div class="col-md-6"><label class="form-label">Correo</label><input class="form-control" type="email" name="correo" th:value="${proveedor.correo}"></div><div class="col-12"><label class="form-label">Dirección</label><input class="form-control" name="direccion" th:value="${proveedor.direccion}"></div></div><button class="btn btn-danger mt-4">Guardar</button></form></div></section></body></html>
