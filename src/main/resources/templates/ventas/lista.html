<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section})}"><head><meta charset="UTF-8"></head><body><section><div class="page-header"><h1>Ventas</h1><a class="btn btn-danger" th:href="@{/ventas/nueva}"><i class="bi bi-plus-lg"></i> Registrar venta</a></div><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="table-panel table-responsive"><table class="table table-hover"><thead><tr><th>Fecha</th><th>Cliente</th><th>Pago</th><th>Total</th><th></th></tr></thead><tbody><tr th:each="v:${ventas}"><td th:text="${#temporals.format(v.fecha,'dd/MM/yyyy HH:mm')}"></td><td th:text="${v.clienteNombre==null?'Cliente general':v.clienteNombre}"></td><td th:text="${v.metodoPago}"></td><td th:text="'$ ' + ${#numbers.formatDecimal(v.total * 1000,1,'POINT',0,'COMMA')}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{/ventas/{id}(id=${v.id})}"><i class="bi bi-eye"></i></a></td></tr><tr th:if="${#lists.isEmpty(ventas)}"><td colspan="5" class="text-center py-4 text-secondary">No hay ventas registradas.</td></tr></tbody></table></div></section></body></html>
